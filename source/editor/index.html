---
layout: false
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://api.github.com; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>文章编辑 | 我的博客</title>
  <link rel="stylesheet" href="editor.css?v=2">
  <script src="editor.js?v=3" defer></script>
</head>
<body>
  <div id="auth-view" class="auth-view">
    <header class="auth-header"><a href="../" target="_blank" rel="noopener noreferrer">我的博客</a><span>文章编辑</span></header>
    <main class="auth-main">
      <div class="auth-heading"><span class="auth-icon"><i data-lucide="square-pen"></i></span><h1>开始写作</h1><p>Zyzhou1120 / blog</p></div>
      <form id="auth-form" class="auth-form">
        <label for="token">GitHub 访问令牌</label>
        <div class="token-field"><i data-lucide="key-round"></i><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_..." required></div>
        <button id="auth-button" class="primary-button" type="submit">连接仓库 <i data-lucide="arrow-right"></i></button>
        <p id="auth-error" class="form-error" role="alert" hidden></p>
      </form>
      <p class="auth-note">仅接受仓库所有者的令牌，需授予此仓库 Contents 读写权限。当前标签页刷新后会自动连接；关闭标签页或退出编辑后清除令牌。</p>
      <a class="token-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">创建细粒度令牌 <i data-lucide="external-link"></i></a>
    </main>
  </div>

  <div id="editor-view" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand"><button id="sidebar-toggle" class="icon-button mobile-only" type="button" aria-label="文章列表" title="文章列表"><i data-lucide="menu"></i></button><a href="../" class="brand-name" target="_blank" rel="noopener noreferrer">我的博客</a><span class="brand-divider"></span><span class="brand-section">写作</span></div>
      <div class="top-actions"><span id="save-state" class="save-state" role="status">已同步</span><button id="new-post" class="quiet-button" type="button"><i data-lucide="file-plus-2"></i><span>新文章</span></button><button id="publish" class="primary-button" type="button"><i data-lucide="upload"></i><span>提交文章</span></button><button id="logout" class="icon-button" type="button" aria-label="退出编辑" title="退出编辑"><i data-lucide="log-out"></i></button></div>
    </header>
    <div class="workbench">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top"><div class="sidebar-title">文章</div><button id="refresh-posts" class="icon-button" type="button" aria-label="刷新文章" title="刷新文章"><i data-lucide="refresh-cw"></i></button></div>
        <div id="post-list" class="post-list" role="listbox" aria-label="文章列表"></div>
        <div class="sidebar-foot"><span id="account-name"></span><a href="../" target="_blank" rel="noopener noreferrer" title="查看博客" aria-label="查看博客"><i data-lucide="external-link"></i></a></div>
      </aside>
      <main class="main-area">
        <div class="document-bar"><div class="document-name"><i data-lucide="file-text"></i><span id="filename">选择文章</span><span id="dirty-dot" class="dirty-dot" hidden></span><button id="reload-post" class="icon-button reload-post" type="button" aria-label="载入最新文章" title="载入最新文章" disabled><i data-lucide="refresh-cw"></i></button></div><div class="document-meta"><span id="word-count">0 字</span><div class="view-switch" role="group" aria-label="视图"><button id="edit-tab" class="active" type="button">编辑</button><button id="preview-tab" type="button">预览</button></div></div></div>
        <div id="conflict-notice" class="draft-notice conflict-notice" hidden><span>远程文章已有新修改，你的草稿已保存在本地。</span><button id="reload-conflict" type="button">载入最新版本</button></div>
        <div id="draft-notice" class="draft-notice" hidden><span id="draft-copy">发现未提交的本地草稿</span><button id="restore-draft" type="button">恢复</button><button id="dismiss-draft" type="button" aria-label="忽略草稿" title="忽略草稿"><i data-lucide="x"></i></button></div>
        <div class="panes"><section id="edit-pane" class="pane edit-pane" aria-label="Markdown 编辑"><div class="pane-header"><span>MARKDOWN</span><span id="edit-hint">自动保存草稿</span></div><textarea id="markdown" spellcheck="false" placeholder="开始写作..."></textarea></section><section id="preview-pane" class="pane preview-pane" aria-label="文章预览"><div class="pane-header"><span>预览</span><span>实时更新</span></div><div id="preview" class="preview-content"></div></section></div>
        <div id="message" class="message" role="status" hidden></div>
      </main>
    </div>
  </div>

  <dialog id="new-dialog" class="new-dialog"><form id="new-form" method="dialog"><div class="dialog-head"><h2>新文章</h2><button id="close-dialog" class="icon-button" type="button" aria-label="关闭" title="关闭"><i data-lucide="x"></i></button></div><label for="new-title">标题</label><input id="new-title" type="text" maxlength="100" required placeholder="输入文章标题"><div class="dialog-actions"><button id="cancel-new" class="quiet-button" type="button">取消</button><button class="primary-button" type="submit">创建草稿</button></div></form></dialog>
</body>
</html>
